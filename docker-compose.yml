name: reto-guabina

x-api-env: &api-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  JWT_SECRET: ${JWT_SECRET}
  CEDULA_KEYS: ${CEDULA_KEYS}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20
    networks: [interna]          # sin puertos publicados al host

  init:                           # esquema + datos de ejemplo, luego termina
    build: {context: ./backend, target: runtime}
    environment: *api-env
    command: sh -c "flask --app wsgi init-db && flask --app wsgi seed"
    depends_on: {db: {condition: service_healthy}}
    networks: [interna]
    restart: "no"

  api:
    build: {context: ./backend, target: runtime}
    environment: *api-env
    depends_on:
      init: {condition: service_completed_successfully}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [interna]          # solo alcanzable a traves de web (nginx)

  web:
    build: ./frontend
    ports: ["${WEB_PORT:-8088}:8080"]
    depends_on: [api]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [interna]

  # ---- pruebas (perfil "test") ----
  api-tests:
    profiles: [test]
    build: {context: ./backend, target: test}
    environment:
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/reto_test
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/reto_test
      JWT_SECRET: ${JWT_SECRET}
      CEDULA_KEYS: ${CEDULA_KEYS}
    depends_on: {db: {condition: service_healthy}}
    networks: [interna]

  web-tests:
    profiles: [test]
    build: {context: ./frontend, target: test}
    command: npm test

volumes:
  pgdata:

networks:
  interna:
